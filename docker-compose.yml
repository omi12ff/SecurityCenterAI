name: securitycenterai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_center_ai}
      POSTGRES_USER: ${POSTGRES_USER:-security_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security_center_local_2026}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: securitycenterai_postgres_data
