name: Verificacion de Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend, agente y web (sin PostgreSQL o E2E)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar SDK de global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Instalar Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependencias del frontend desde el lockfile
        working-directory: src/SecurityCenterAI.Web
        run: npm.cmd ci

      - name: Compilar y probar con el helper del repositorio
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify.ps1 -Configuration CiQa
